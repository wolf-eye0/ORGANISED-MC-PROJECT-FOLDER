<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2600 1500" width="2600" height="1500" style="background-color: #0b0f17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0e1118"/>
    </linearGradient>
    <linearGradient id="motorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d0a0a"/>
      <stop offset="100%" stop-color="#5a1515"/>
    </linearGradient>

    <filter id="partGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="40" y="30" width="2520" height="100" fill="#161b22" stroke="#30363d" stroke-width="2" rx="8" filter="url(#partGlow)"/>
  <rect x="42" y="32" width="12" height="96" fill="#da3633" rx="4"/>
  <text x="75" y="70" fill="#ffffff" font-size="28" font-weight="800">VIBEGUARD: 12V MOTOR RIG SAFETY CIRCUIT &amp; BACK-EMF SUPPRESSION</text>
  <text x="75" y="105" fill="#8b949e" font-size="16" font-weight="500">EXHAUSTIVE ELECTRICAL SCHEMATIC, INDUCTIVE FLYBACK PROTECTION &amp; GALVANIC ISOLATION ARCHITECTURE</text>

  <!-- Top Main Schematic Box -->
  <rect x="40" y="160" width="2520" height="680" fill="url(#boxGrad)" stroke="#f85149" stroke-width="2.5" rx="12" filter="url(#partGlow)"/>
  <rect x="60" y="146" width="460" height="28" fill="#da3633" rx="4"/>
  <text x="75" y="165" fill="#ffffff" font-size="14" font-weight="800">COMPLETE 12V EXCITATION DRIVE SCHEMATIC</text>

  <!-- 1. DC Supply -->
  <g transform="translate(100, 240)">
    <rect x="0" y="0" width="340" height="260" fill="#0d1117" stroke="#6e7681" stroke-width="2" rx="8"/>
    <text x="170" y="35" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">12V DC POWER SUPPLY</text>
    <text x="170" y="58" fill="#8b949e" font-size="12" text-anchor="middle">230V AC → 12V DC, 2A Regulated</text>

    <!-- DC Jack -->
    <rect x="40" y="100" width="260" height="110" fill="#161b22" stroke="#d29922" stroke-width="1.5" rx="6"/>
    <circle cx="90" cy="155" r="25" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
    <circle cx="90" cy="155" r="8" fill="#d29922"/>
    <text x="190" y="145" fill="#d29922" font-size="14" font-weight="800">5.5 × 2.1 mm JACK</text>
    <text x="190" y="168" fill="#3fb950" font-size="12" font-weight="700">Center Positive (+)</text>
  </g>

  <!-- 2. KCD1 Switch -->
  <g transform="translate(560, 240)">
    <rect x="0" y="0" width="340" height="260" fill="#0d1117" stroke="#6e7681" stroke-width="2" rx="8"/>
    <text x="170" y="35" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">KCD1 ROCKER SWITCH</text>
    <text x="170" y="58" fill="#8b949e" font-size="12" text-anchor="middle">SPST Inline Master Power Cut</text>

    <rect x="95" y="110" width="150" height="90" fill="#161b22" stroke="#da3633" stroke-width="2" rx="6"/>
    <path d="M 120 180 L 170 130 L 220 180 Z" fill="#da3633"/>
    <text x="170" y="160" fill="#ffffff" font-size="22" font-weight="900" text-anchor="middle">I / O</text>
  </g>

  <!-- 3. 1A Fuse -->
  <g transform="translate(1020, 240)">
    <rect x="0" y="0" width="400" height="260" fill="#0d1117" stroke="#6e7681" stroke-width="2" rx="8"/>
    <text x="200" y="35" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">1.0A 250V CARTRIDGE FUSE</text>
    <text x="200" y="58" fill="#8b949e" font-size="12" text-anchor="middle">5×20 mm Time-Delay (Robu Order 2)</text>

    <g transform="translate(50, 130)">
      <rect x="0" y="0" width="40" height="50" fill="#c9d1d9" stroke="#ffffff" stroke-width="1.5" rx="3"/>
      <rect x="260" y="0" width="40" height="50" fill="#c9d1d9" stroke="#ffffff" stroke-width="1.5" rx="3"/>
      <rect x="40" y="4" width="220" height="42" fill="#58a6ff" fill-opacity="0.15" stroke="#6e7681" stroke-width="1.5"/>
      <path d="M 40 25 Q 110 10, 150 25 T 260 25" fill="none" stroke="#d29922" stroke-width="3"/>
      <text x="150" y="30" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">1.0 A FUSE</text>
    </g>
  </g>

  <!-- 4. 1N4007 Diode + Motor -->
  <g transform="translate(1540, 240)">
    <rect x="0" y="0" width="920" height="520" fill="url(#motorGrad)" stroke="#f85149" stroke-width="3" rx="10"/>
    <text x="460" y="38" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">N20 MOTOR (12V 600 RPM) &amp; 1N4007 FLYBACK DIODE</text>

    <!-- Diode Symbol in Anti-Parallel -->
    <g transform="translate(120, 120)">
      <rect x="0" y="0" width="280" height="340" fill="#0d1117" stroke="#d29922" stroke-width="2" rx="8"/>
      <text x="140" y="35" fill="#d29922" font-size="15" font-weight="800" text-anchor="middle">1N4007 FLYBACK CLAMP</text>
      <text x="140" y="55" fill="#8b949e" font-size="11" text-anchor="middle">Anti-Parallel Configuration</text>

      <!-- Diode Symbol Vertical -->
      <g transform="translate(140, 180)">
        <!-- Anode (Bottom, GND) -->
        <line x1="0" y1="90" x2="0" y2="40" stroke="#0969da" stroke-width="4"/>
        <circle cx="0" cy="90" r="5" fill="#0969da"/>
        <text x="15" y="85" fill="#0969da" font-size="12" font-weight="800">Anode (GND)</text>

        <!-- Triangle -->
        <polygon points="-30,40 30,40 0,-20" fill="#21262d" stroke="#f85149" stroke-width="3"/>

        <!-- Cathode Bar (Top, +12V) -->
        <line x1="-35" y1="-20" x2="35" y2="-20" stroke="#ffffff" stroke-width="6"/>
        <text x="45" y="-15" fill="#da3633" font-size="12" font-weight="800">Cathode (+12V)</text>
        <text x="45" y="0" fill="#8b949e" font-size="10">(Silver Band)</text>

        <line x1="0" y1="-20" x2="0" y2="-70" stroke="#da3633" stroke-width="4"/>
        <circle cx="0" cy="-70" r="5" fill="#da3633"/>
      </g>
    </g>

    <!-- Motor Representation -->
    <g transform="translate(480, 160)">
      <rect x="0" y="0" width="380" height="260" fill="#0d1117" stroke="#6e7681" stroke-width="2" rx="8"/>
      <text x="190" y="35" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">N20 GEAR MOTOR</text>

      <g transform="translate(60, 70)">
        <rect x="0" y="30" width="100" height="100" fill="#21262d" stroke="#8b949e" stroke-width="2" rx="4"/>
        <text x="50" y="85" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">GEARBOX</text>

        <rect x="100" y="38" width="140" height="85" fill="#161b22" stroke="#6e7681" stroke-width="2" rx="5"/>
        <text x="170" y="85" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">DC MOTOR</text>

        <rect x="240" y="55" width="20" height="15" fill="#d29922" stroke="#ffffff"/>
        <text x="270" y="67" fill="#da3633" font-size="12" font-weight="800">(+) Terminal</text>

        <rect x="240" y="92" width="20" height="15" fill="#d29922" stroke="#ffffff"/>
        <text x="270" y="104" fill="#0969da" font-size="12" font-weight="800">(-) Terminal</text>

        <!-- Clamped Cam -->
        <g transform="translate(-40, 0)">
          <path d="M 0 55 L -35 35 A 25 25 0 0 0 -35 125 L 0 105 Z" fill="#238636" stroke="#2ea043" stroke-width="2"/>
          <circle cx="-35" cy="80" r="15" fill="#d29922" stroke="#ffffff" stroke-width="1.5"/>
          <text x="-35" y="85" fill="#000000" font-size="9" font-weight="900" text-anchor="middle">M3</text>
        </g>
      </g>
    </g>

    <!-- Diode to Motor Parallel Links -->
    <path d="M 260 90 L 740 90 L 740 215" fill="none" stroke="#da3633" stroke-width="4"/>
    <path d="M 260 270 L 740 270 L 740 252" fill="none" stroke="#0969da" stroke-width="4"/>
  </g>

  <!-- Wiring between Top Blocks -->
  <path d="M 440 370 L 560 370" fill="none" stroke="#da3633" stroke-width="4"/>
  <path d="M 900 370 L 1020 370" fill="none" stroke="#da3633" stroke-width="4"/>
  <path d="M 1420 370 L 1540 370 L 1540 330 L 1800 330" fill="none" stroke="#da3633" stroke-width="4"/>
  <!-- Return GND wire along bottom -->
  <path d="M 370 450 L 370 650 L 1800 650 L 1800 510" fill="none" stroke="#0969da" stroke-width="4" stroke-dasharray="8,4"/>

  <!-- Bottom Detailed Theory & Safety Panels -->
  <g transform="translate(40, 870)">
    <!-- Panel 1: Inductive Spike Physics -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="800" height="570" fill="#161b22" stroke="#30363d" stroke-width="2" rx="10" filter="url(#partGlow)"/>
      <rect x="15" y="15" width="770" height="35" fill="#21262d" rx="4"/>
      <text x="35" y="38" fill="#d29922" font-size="14" font-weight="800">1. INDUCTIVE FLYBACK PHYSICS (BACK-EMF SPIKE)</text>

      <g transform="translate(30, 75)">
        <text x="0" y="20" fill="#ffffff" font-size="13" font-weight="700">The Problem: Armature Inductance Spike</text>
        <text x="0" y="45" fill="#8b949e" font-size="12">When motor power is switched OFF, the magnetic field collapses instantly:</text>
        <rect x="0" y="60" width="420" height="45" fill="#0d1117" stroke="#d29922" rx="5"/>
        <text x="210" y="88" fill="#d29922" font-size="16" font-weight="800" text-anchor="middle">V_spike = - L · (di / dt) ≈ -80V to -120V</text>

        <text x="0" y="135" fill="#ffffff" font-size="13" font-weight="700">The Fix: 1N4007 Flyback Clamping Diode</text>
        <text x="0" y="160" fill="#8b949e" font-size="12">• Normal Operation: Reverse-biased (Cathode at +12V, Anode at GND). Diode is OFF.</text>
        <text x="0" y="185" fill="#8b949e" font-size="12">• Power Cut: Collapse polarity flips; diode becomes forward-biased (V_f ≈ 0.7V).</text>
        <text x="0" y="210" fill="#3fb950" font-size="12" font-weight="700">Spike is harmlessly recirculated and clamped to -0.7V, protecting the switch.</text>

        <!-- Oscilloscope Waveform Graphic -->
        <rect x="0" y="240" width="740" height="220" fill="#0d1117" stroke="#30363d" rx="6"/>
        <text x="370" y="270" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">OSCILLOSCOPE VOLTAGE TRANSIENT AT MOTOR TURN-OFF</text>

        <!-- Axis -->
        <line x1="60" y1="360" x2="700" y2="360" stroke="#6e7681" stroke-width="1.5"/>
        <line x1="120" y1="280" x2="120" y2="440" stroke="#6e7681" stroke-width="1.5"/>
        <text x="70" y="320" fill="#da3633" font-size="11" font-weight="700">+12V</text>
        <text x="80" y="365" fill="#8b949e" font-size="11">0V</text>
        <text x="60" y="420" fill="#f85149" font-size="11" font-weight="700">-80V</text>

        <!-- Unprotected Spike (Red Dashed) -->
        <path d="M 120 320 L 250 320 L 250 430 L 280 360 L 700 360" fill="none" stroke="#f85149" stroke-width="2.5" stroke-dasharray="6,4"/>
        <text x="310" y="425" fill="#f85149" font-size="11" font-weight="700">WITHOUT DIODE: -80V Catastrophic Spike</text>

        <!-- Protected Clamp (Green Solid) -->
        <path d="M 120 320 L 250 320 L 250 375 L 350 360 L 700 360" fill="none" stroke="#3fb950" stroke-width="3"/>
        <text x="360" y="345" fill="#3fb950" font-size="11" font-weight="800">WITH 1N4007: Clamped to -0.7V (Completely Safe!)</text>
      </g>
    </g>

    <!-- Panel 2: Galvanic Isolation & Ground Integrity -->
    <g transform="translate(840, 0)">
      <rect x="0" y="0" width="820" height="570" fill="#161b22" stroke="#30363d" stroke-width="2" rx="10" filter="url(#partGlow)"/>
      <rect x="15" y="15" width="790" height="35" fill="#21262d" rx="4"/>
      <text x="35" y="38" fill="#f85149" font-size="14" font-weight="800">2. GALVANIC DOMAIN ISOLATION &amp; GROUND INTEGRITY</text>

      <g transform="translate(30, 75)">
        <text x="0" y="20" fill="#ffffff" font-size="13" font-weight="700">Why 12V GND Must NEVER Touch ESP32 GND:</text>
        <text x="0" y="45" fill="#8b949e" font-size="12">1. DC motors have mechanical carbon/copper brushes switching coils continuously.</text>
        <text x="0" y="70" fill="#8b949e" font-size="12">2. Brush arcing injects massive broadband RF noise (10 kHz to 50 MHz) into ground.</text>
        <text x="0" y="95" fill="#8b949e" font-size="12">3. Connecting grounds creates a ground loop circulating high-frequency ripple through</text>
        <text x="0" y="115" fill="#8b949e" font-size="12">   the sensitive ADXL345 SPI ground plane, causing corrupted packets and false trips.</text>
        <text x="0" y="140" fill="#8b949e" font-size="12">4. In worst case, an inductive surge can flow through the USB cable and destroy the PC!</text>

        <rect x="0" y="170" width="760" height="180" fill="#211212" stroke="#f85149" stroke-width="2" rx="8"/>
        <text x="25" y="205" fill="#f85149" font-size="14" font-weight="900">VERIFICATION BEFORE POWER-ON (MULTIMETER AUDIT):</text>
        <text x="25" y="235" fill="#ffffff" font-size="12">1. Set digital multimeter (DMM) to <tspan fill="#d29922" font-weight="700">Resistance (Ω) / Continuity Beeper</tspan>.</text>
        <text x="25" y="260" fill="#ffffff" font-size="12">2. Touch Probe 1 to Motor (-) Terminal.</text>
        <text x="25" y="285" fill="#ffffff" font-size="12">3. Touch Probe 2 to ESP32 GND pin (or Breadboard Blue Rail).</text>
        <text x="25" y="315" fill="#3fb950" font-size="14" font-weight="900">EXPECTED READING: Open Circuit (OL / ∞ Ω, NO BEEP).</text>
        <text x="25" y="335" fill="#ff7b72" font-size="11">If meter beeps, STOP IMMEDIATELY! You have an illegal ground short.</text>
      </g>
    </g>

    <!-- Panel 3: Fuse & Mechanical Transmission -->
    <g transform="translate(1700, 0)">
      <rect x="0" y="0" width="820" height="570" fill="#161b22" stroke="#30363d" stroke-width="2" rx="10" filter="url(#partGlow)"/>
      <rect x="15" y="15" width="790" height="35" fill="#21262d" rx="4"/>
      <text x="35" y="38" fill="#58a6ff" font-size="14" font-weight="800">3. OVERCURRENT FUSE SIZING &amp; BASEPLATE COUPLING</text>

      <g transform="translate(30, 75)">
        <text x="0" y="20" fill="#ffffff" font-size="13" font-weight="700">1A Fuse Protection Rationale:</text>
        <text x="0" y="45" fill="#8b949e" font-size="12">• N20 12V 600 RPM motor running current: ~70 mA to 120 mA.</text>
        <text x="0" y="70" fill="#8b949e" font-size="12">• Stall current (if arm binds or eccentric mass catches): ~800 mA to 950 mA.</text>
        <text x="0" y="95" fill="#8b949e" font-size="12">• 1.0A Time-Delay Fuse allows startup inrush while blowing within &lt; 2s under</text>
        <text x="0" y="115" fill="#8b949e" font-size="12">   prolonged stall, preventing motor coil burnout or power supply overheating.</text>

        <rect x="0" y="160" width="760" height="280" fill="#0d1117" stroke="#388bfd" stroke-width="2" rx="8"/>
        <text x="380" y="195" fill="#58a6ff" font-size="14" font-weight="800" text-anchor="middle">ACRYLIC BASEPLATE VIBRATION TRANSMISSION</text>
        <text x="380" y="220" fill="#c9d1d9" font-size="12" text-anchor="middle">Two 5mm Transparent Cast Acrylite Sheets (150×150 mm) Laminated</text>

        <!-- Baseplate Graphic -->
        <g transform="translate(200, 240)">
          <rect x="0" y="0" width="360" height="22" fill="#58a6ff" fill-opacity="0.35" stroke="#388bfd" stroke-width="2" rx="2"/>
          <text x="180" y="16" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">Top 5mm Acrylite Sheet</text>

          <rect x="0" y="22" width="360" height="22" fill="#58a6ff" fill-opacity="0.25" stroke="#388bfd" stroke-width="2" rx="2"/>
          <text x="180" y="38" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">Bottom 5mm Acrylite Sheet</text>

          <text x="180" y="80" fill="#3fb950" font-size="12" font-weight="800" text-anchor="middle">Total Thickness = 10.0 mm Rigid Slab</text>
          <text x="180" y="100" fill="#8b949e" font-size="11" text-anchor="middle">Eliminates flexural modes below 80 Hz; transfers pure 10.0 Hz wave</text>
        </g>
      </g>
    </g>
  </g>

</svg>
