<text x="657" y="396" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">WORKSHOP TOOLING &amp; CLAMPING INSTRUCTIONS</text>
<text x="657" y="416" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="bold">1. Total Holes:</text>
<text x="775" y="416" fill="#cbd5e1" font-family="sans-serif" font-size="9">Exactly 8 holes (all identical Ø3.3 mm through-holes).</text>
<text x="657" y="436" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="bold">2. Pilot Bit (2.5 mm):</text>
<text x="775" y="436" fill="#cbd5e1" font-family="sans-serif" font-size="9">Drill all 8 holes first at 600–800 RPM with wood backing.</text>
<text x="657" y="456" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="bold">3. Final Bit (3.3 mm):</text>
<text x="775" y="456" fill="#cbd5e1" font-family="sans-serif" font-size="9">Re-drill straight through pilot holes for clean M3 clearance.</text>
<text x="657" y="476" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="bold">4. Sandwich Drilling:</text>
<text x="775" y="476" fill="#cbd5e1" font-family="sans-serif" font-size="9">Clamp both 5 mm acrylic sheets together with tape/clamps.</text>
<text x="657" y="496" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="bold">5. Mandatory INDEX A:</text>
<text x="775" y="496" fill="#cbd5e1" font-family="sans-serif" font-size="9">Mark 'INDEX A' on the top-left edge of BOTH sheets.</text>
<text x="657" y="516" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="bold">6. No Glue Today?</text>
<text x="775" y="516" fill="#cbd5e1" font-family="sans-serif" font-size="9">Assemble with 4 corner M3 bolts immediately! Tightening</text>
<text x="775" y="536" fill="#cbd5e1" font-family="sans-serif" font-size="9">provides ~3500 N clamping force, fully rigid for motor testing.</text>
<text x="657" y="556" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="bold">7. Solvent/Epoxy Later:</text>
<text x="775" y="556" fill="#cbd5e1" font-family="sans-serif" font-size="9">Introduce DCM solvent along edges via capillary syringe,</text>
<text x="775" y="576" fill="#cbd5e1" font-family="sans-serif" font-size="9">or separate, apply Araldite Clear, and re-bolt using holes.</text>
<rect x="645" y="628" width="350" height="80" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2" rx="4" />
<text x="659" y="650" fill="#34d399" font-family="sans-serif" font-size="10.5" font-weight="bold">✓ MATHEMATICAL VERIFICATION PASSED</text>
<text x="659" y="668" fill="#a7f3d0" font-family="sans-serif" font-size="9">• 3.3 mm Hole vs M3 Bolt (2.95 mm): Clearance = 0.175 mm/side (ISO Normal).</text>
<text x="659" y="682" fill="#a7f3d0" font-family="sans-serif" font-size="9">• Washer Bearing Area = 29.9 mm² (98.4% retention vs 3.2 mm hole).</text>
<text x="659" y="696" fill="#a7f3d0" font-family="sans-serif" font-size="9">• Inter-bracket daylight clearance = exactly 20.00 mm.</text>
